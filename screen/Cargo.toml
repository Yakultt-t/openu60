[package]
name = "openu60-screen"
version = "0.1.0"
edition = "2021"
description = "OpenU60 touchscreen UI for the ZTE U60 Pro (DRM atomic KMS, 320x480)"

[dependencies]
drm = "0.14"
ab_glyph = "0.2"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["json"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
qrcode = { version = "0.14", default-features = false }


[[bin]]
name = "openu60-screen"
path = "src/main.rs"

[[bin]]
name = "screen-preview"
path = "src/bin/preview.rs"
