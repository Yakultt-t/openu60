[package]
name = "openu60-pushgw"
version = "0.1.0"
edition = "2021"
description = "Push gateway for OpenU60: routers sign push requests with their device key, the gateway holds the APNs key and forwards to Apple"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "signal", "sync"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "http2", "rustls-tls"] }
ring = "0.17"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
