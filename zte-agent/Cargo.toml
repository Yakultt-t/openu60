[package]
name = "zte-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tiny_http = "0.12"
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }
libc = "0.2"
base64 = "0.22"
hex = "0.4"
ring = "0.17"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "http2", "rustls-tls"] }
httpdate = "1"
aes-gcm = "0.10"
rsa = "0.9"
x509-cert = "0.2"
rand = "0.8"
openu60-tunnel = { path = "../tunnel", features = ["mdns"] }
log = "0.4"
